services:
  mariadb:
    image: mariadb:11
    container_name: vuln-web-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: koperasi_root
      MARIADB_DATABASE: koperasi
      MARIADB_USER: koperasi
      MARIADB_PASSWORD: koperasi
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mariadb_data:
